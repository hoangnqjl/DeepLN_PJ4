<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Checking</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: #ffffff;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .aura {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 750px;
            height: 400px;
            background: radial-gradient(circle at 35% 50%, rgba(186, 230, 253, 0.8) 0%, transparent 60%),
                        radial-gradient(circle at 65% 50%, rgba(244, 114, 182, 0.6) 0%, transparent 60%);
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
            animation: pulseAura 3s infinite alternate ease-in-out;
        }

        @keyframes pulseAura {
            0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
        }

        .content {
            z-index: 10;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 2rem;
            color: #374151;
        }

        #preview-container {
            display: none;
            margin-bottom: 2rem;
            text-align: center;
            position: relative;
        }

        #preview-img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #f3f4f6;
        }

        .input-bar {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 50px;
            padding: 0.5rem 1rem;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.05), 0 0 1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 650px;
            transition: box-shadow 0.3s ease;
        }

        .input-bar:focus-within {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 0 1px rgba(0, 0, 0, 0.15);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #6b7280;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background: #f3f4f6;
            color: #1f2937;
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
        }

        #text-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: #1f2937;
            padding: 0.5rem 1rem;
            resize: none;
            overflow-y: auto;
            max-height: 200px;
            line-height: 1.5;
        }

        #text-input::placeholder {
            color: #9ca3af;
        }

        .badge {
            font-size: 0.85rem;
            color: #6b7280;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            cursor: pointer;
        }
        
        .badge:hover {
            background: #f3f4f6;
        }

        .results {
            margin-top: 3rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            width: 100%;
            max-width: 650px;
            display: none;
        }

        .result-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03), 0 1px 3px rgba(0,0,0,0.05);
            border: 1px solid #f3f4f6;
        }

        .result-label {
            font-size: 0.9rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .result-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .value-real { color: #10b981; }
        .value-fake { color: #ef4444; }

        .ocr-box {
            grid-column: span 2;
            background: #f9fafb;
            border-radius: 16px;
            padding: 1.2rem;
            font-size: 0.95rem;
            color: #4b5563;
            border-left: 4px solid #bae6fd;
            text-align: left;
            line-height: 1.5;
        }

        .loading {
            display: none;
            margin-top: 2rem;
            text-align: center;
            color: #6b7280;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>
    <div class="aura"></div>
    
    <div class="content">
        <h1 class="title">Fake News Checking</h1>
        
        <div id="preview-container">
            <img id="preview-img" src="" alt="Preview">
        </div>

        <div class="input-bar">
            <button class="icon-btn" id="btn-upload" title="Tải ảnh lên">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
            </button>
            <input type="file" id="file-input" hidden accept="image/*">
            
            <textarea id="text-input" placeholder="Nhập tin tức hoặc dán ảnh (Ctrl+V)..." rows="1"></textarea>
            

            
            <button class="icon-btn" id="btn-predict" title="Kiểm tra">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>

        <div class="loading" id="loader">
            <div class="spinner"></div>
            <p>Đang phân tích...</p>
        </div>

        <div class="results" id="results-area">
            <div class="ocr-box" id="ocr-result" style="display: none;"></div>
            
            <div class="result-card">
                <div class="result-label">Mô hình LSTM</div>
                <div class="result-value" id="res-lstm">-</div>
            </div>

            <div class="result-card">
                <div class="result-label">Mô hình PhoBERT</div>
                <div class="result-value" id="res-phobert">-</div>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const btnPredict = document.getElementById('btn-predict');
        const btnUpload = document.getElementById('btn-upload');
        const fileInput = document.getElementById('file-input');
        const loader = document.getElementById('loader');
        const resultsArea = document.getElementById('results-area');
        const ocrBox = document.getElementById('ocr-result');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');

        // Xử lý auto resize textarea
        const autoResize = () => {
            textInput.style.height = 'auto';
            textInput.style.height = Math.min(textInput.scrollHeight, 200) + 'px';
        };
        textInput.addEventListener('input', autoResize);

        // Gửi text prediction khi click nút hoặc ấn Enter
        const submitText = async () => {
            const text = textInput.value.trim();
            if (!text) return;
            
            textInput.value = '';
            autoResize();
            
            showLoading(true);
            const formData = new FormData();
            formData.append('text', text);

            try {
                const response = await fetch('/predict/text', { method: 'POST', body: formData });
                const data = await response.json();
                displayResults(data);
            } catch (err) {
                alert("Lỗi kết nối server!");
            } finally {
                showLoading(false);
            }
        };

        btnPredict.onclick = submitText;
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitText();
            }
        });

        // Xử lý upload ảnh
        btnUpload.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFiles(e.target.files);

        // Kéo thả vào input bar
        const inputBar = document.querySelector('.input-bar');
        inputBar.ondragover = (e) => { e.preventDefault(); inputBar.style.boxShadow = "0 0 0 2px #bae6fd"; };
        inputBar.ondragleave = () => { inputBar.style.boxShadow = ""; };
        inputBar.ondrop = (e) => {
            e.preventDefault();
            inputBar.style.boxShadow = "";
            handleFiles(e.dataTransfer.files);
        };

        // Ctrl + V (Paste Image)
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    handleFiles([blob]);
                }
            }
        });

        async function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];

            // Hiển thị preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);

            showLoading(true);
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict/image', { method: 'POST', body: formData });
                const data = await response.json();
                displayResults(data);
            } catch (err) {
                alert("Lỗi xử lý ảnh!");
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            loader.style.display = show ? 'block' : 'none';
            resultsArea.style.display = show ? 'none' : 'grid';
            if (show) {
                // Keep preview if we are loading an image
            }
        }

        function displayResults(data) {
            if (data.text) {
                ocrBox.innerText = "📝 Nội dung trích xuất: " + data.text;
                ocrBox.style.display = 'block';
            } else {
                ocrBox.style.display = 'none';
            }

            updateValue('res-lstm', data.lstm);
            updateValue('res-phobert', data.phobert);
            resultsArea.style.display = 'grid';
        }

        function updateValue(id, val) {
            const el = document.getElementById(id);
            el.innerText = val;
            el.className = 'result-value ' + (val === 'Real' ? 'value-real' : 'value-fake');
        }
    </script>
</body>
</html>
